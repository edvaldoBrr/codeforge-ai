[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redireciona todas as chamadas /api/* para a Serverless Function do Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Suporte a SPA (Single Page Application) para o frontend React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@vitejs/devtools", "vite"]
